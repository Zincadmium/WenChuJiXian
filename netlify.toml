# 纹初迹现 · Netlify 配置
[build]
  command = "echo 'static site - nothing to build'"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 函数超时上限（秒）。万相/Tripo 生成较慢，放宽到 Netlify 免费档允许的最大值。
[[functions."proxy".config]]
  timeout = 26

[[functions."submit3d".config]]
  timeout = 15

[[functions."check3d".config]]
  timeout = 15
